<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USSH HCM - Quản lý Trường hợp</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeInSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeInSlideUp 0.2s ease-out forwards; }
        ::selection { background-color: #bfdbfe; color: #1e3a8a; }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-hidden">
    <div id="root">
        <div class="flex flex-col items-center justify-center h-screen bg-slate-50">
            <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
            <p class="mt-4 text-slate-500 font-medium">Đang khởi tạo hệ thống...</p>
        </div>
    </div>

    <script type="text/babel">
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error.toString() }; }
            componentDidCatch(error, errorInfo) { console.error("Lỗi:", error, errorInfo); }
            render() {
                if (this.state.hasError) return (
                    <div className="p-10 bg-red-50 text-red-800 h-screen flex flex-col items-center justify-center">
                        <h2 className="text-3xl font-bold mb-4">⚠️ Hệ Thống Gặp Sự Cố</h2>
                        <p className="bg-white p-6 border-2 border-red-300 rounded-xl shadow">{this.state.errorInfo}</p>
                        <button onClick={() => window.location.reload()} className="mt-6 px-6 py-3 bg-red-600 text-white font-bold rounded-xl">Tải lại trang</button>
                    </div>
                );
                return this.props.children;
            }
        }

        const { useState, useRef, useEffect } = React;
        
        // ICONS
        const TextIcon = ({ symbol, className }) => <span className={`inline-flex items-center justify-center ${className || ''}`}>{symbol}</span>;
        const LayoutDashboard = (p) => <TextIcon symbol="📊" {...p} />; const Users = (p) => <TextIcon symbol="👥" {...p} />;
        const AlertTriangle = (p) => <TextIcon symbol="⚠️" {...p} />; const Search = (p) => <TextIcon symbol="🔍" {...p} />;
        const PlusCircle = (p) => <TextIcon symbol="➕" {...p} />; const CheckCircle = (p) => <TextIcon symbol="✅" {...p} />;
        const Sparkles = (p) => <TextIcon symbol="✨" {...p} />; const Loader2 = ({className}) => <TextIcon symbol="⏳" className={className} />;
        const Bot = (p) => <TextIcon symbol="🤖" {...p} />; const Save = (p) => <TextIcon symbol="💾" {...p} />;
        const X = (p) => <TextIcon symbol="❌" {...p} />; const UserCircle = (p) => <TextIcon symbol="👤" {...p} />;
        const FolderOpen = (p) => <TextIcon symbol="📂" {...p} />; const ShieldAlert = (p) => <TextIcon symbol="🛡️" {...p} />;
        const Target = (p) => <TextIcon symbol="🎯" {...p} />; const Network = (p) => <TextIcon symbol="🔗" {...p} />;
        const ChevronLeft = (p) => <TextIcon symbol="⬅️" {...p} />; const ArrowRight = (p) => <TextIcon symbol="➡️" {...p} />;
        const FileSignature = (p) => <TextIcon symbol="✍️" {...p} />; const UploadCloud = (p) => <TextIcon symbol="☁️" {...p} />;
        const FileType = (p) => <TextIcon symbol="📄" {...p} />; const Building = (p) => <TextIcon symbol="🏢" {...p} />;
        const Trash2 = (p) => <TextIcon symbol="🗑️" {...p} />; const Info = (p) => <TextIcon symbol="ℹ️" {...p} />;
        const Edit3 = (p) => <TextIcon symbol="✏️" {...p} />; const BellRing = (p) => <TextIcon symbol="🔔" {...p} />;
        const BarChart3 = (p) => <TextIcon symbol="📊" {...p} />; const TrendingDown = (p) => <TextIcon symbol="📉" {...p} />;
        const RotateCcw = (p) => <TextIcon symbol="🔄" {...p} />; const Camera = (p) => <TextIcon symbol="📷" {...p} />;
        const ArrowUp = (p) => <TextIcon symbol="⬆️" {...p} />; const ArrowDown = (p) => <TextIcon symbol="⬇️" {...p} />;
        const Paperclip = (p) => <TextIcon symbol="📎" {...p} />;
        const Activity = (p) => <TextIcon symbol="🏥" {...p} />;
        const HeartHandshake = (p) => <TextIcon symbol="🤝" {...p} />;
        const BriefcaseMedical = (p) => <TextIcon symbol="💼" {...p} />;
        const ListTodo = (p) => <TextIcon symbol="📋" {...p} />;
        const SlidersHorizontal = (p) => <TextIcon symbol="🎛️" {...p} />;
        const TrendingUp = (p) => <TextIcon symbol="📈" {...p} />;
        const FileText = (p) => <TextIcon symbol="📝" {...p} />;

        // HELPERS
        const getTodayYMD = () => new Date().toISOString().split('T')[0];
        const formatDateToVN = (dStr) => dStr?.includes('-') ? dStr.split('-').reverse().join('/') : (dStr || '');
        const parseDateStr = (dStr) => { if (!dStr) return new Date(); const p = dStr.split('/'); return p.length===3 ? new Date(`${p[2]}-${p[1]}-${p[0]}T00:00:00`) : new Date(); };
        const getAliasFromName = (name) => name ? name.trim().split(/\s+/).map(w => w[0].toUpperCase() + '.').join('') : '';

        // CHART COMPONENT
        const MiniLineChart = ({ kpiData }) => {
          if (!kpiData || !kpiData.history || kpiData.history.length === 0) return null;
          const { history, target } = kpiData;
          const values = history.map(d => Number(d.value));
          const maxVal = Math.max(...values, target);
          const minVal = Math.min(...values, target, 0);
          const range = maxVal - minVal || 1;
          const width = 600, height = 180, px = 40, py = 30;
          const getX = (i) => px + (i * (width - 2*px) / Math.max(1, history.length - 1));
          const getY = (v) => height - py - ((v - minVal) / range) * (height - 2*py);
          const pts = history.map((d, i) => `${getX(i)},${getY(d.value)}`).join(' ');
          const ty = getY(target);

          return (
            <div className="w-full overflow-x-auto pb-4">
              <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full min-w-[400px] overflow-visible drop-shadow-sm">
                <line x1={px} y1={getY(maxVal)} x2={width-px} y2={getY(maxVal)} stroke="#e2e8f0" strokeWidth="2" />
                <line x1={px} y1={getY((maxVal+minVal)/2)} x2={width-px} y2={getY((maxVal+minVal)/2)} stroke="#e2e8f0" strokeWidth="2" />
                <line x1={px} y1={getY(minVal)} x2={width-px} y2={getY(minVal)} stroke="#cbd5e1" strokeWidth="2" />
                <line x1={px} y1={ty} x2={width-px} y2={ty} stroke="#10b981" strokeWidth="2" strokeDasharray="6,6" />
                <text x={width-px+8} y={ty+4} fill="#10b981" fontSize="12" fontWeight="bold">Đích: {target}</text>
                {history.length > 1 && <polyline points={pts} fill="none" stroke="#3b82f6" strokeWidth="3" />}
                {history.map((d, i) => (
                  <g key={i}>
                    <circle cx={getX(i)} cy={getY(d.value)} r="5" fill="#fff" stroke="#3b82f6" strokeWidth="2"><title>{d.date}: {d.value}</title></circle>
                    <text x={getX(i)} y={getY(d.value)-12} fill="#1e293b" fontSize="12" fontWeight="bold" textAnchor="middle">{d.value}</text>
                    <text x={getX(i)} y={height-5} fill="#64748b" fontSize="10" fontWeight="bold" textAnchor="middle">{d.date.substring(0,5)}</text>
                  </g>
                ))}
              </svg>
            </div>
          );
        };

        // REUSABLE COMPONENTS
        const Field = ({ label, val, setVal, type="text", opts=[], ph="", cls="", lCls="text-slate-800", iCls="bg-white border-slate-300 focus:border-blue-500" }) => (
          <div className={cls}>
            <label className={`block text-sm font-bold mb-1 ${lCls}`}>{label}</label>
            {type === 'select' ? (
              <select value={val||''} onChange={e=>setVal(e.target.value)} className={`w-full p-2.5 text-sm border-2 rounded-lg outline-none transition-colors ${iCls}`}>
                {opts.map(o => <option key={o} value={o}>{o||'-- Chọn --'}</option>)}
              </select>
            ) : type === 'textarea' ? (
              <textarea rows={2} value={val||''} onChange={e=>setVal(e.target.value)} placeholder={ph} className={`w-full p-2.5 text-sm border-2 rounded-lg outline-none transition-colors ${iCls}`}/>
            ) : (
              <input type={type} value={val||''} onChange={e=>setVal(e.target.value)} placeholder={ph} className={`w-full p-2.5 text-sm border-2 rounded-lg outline-none transition-colors ${iCls}`}/>
            )}
          </div>
        );

        const SwotField = ({ l, v, setV, c1, c2 }) => (
          <div><label className={`block text-sm font-bold mb-1 ${c1}`}>{l}</label><textarea rows={3} value={v||''} onChange={e=>setV(e.target.value)} className={`w-full p-2.5 text-sm border-2 rounded-xl outline-none transition-colors shadow-sm ${c2}`} /></div>
        );

        const DocList = ({ docs, onRm }) => {
            if(!docs||docs.length===0) return <p className="text-sm font-medium italic text-slate-500">Chưa có tài liệu đính kèm.</p>;
            return <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">{docs.map((d,i) => (
                <div key={i} className="flex justify-between items-center p-2.5 border-2 border-indigo-200 rounded-lg bg-white shadow-sm hover:border-indigo-400 transition-all">
                    <div className="flex items-center gap-2 overflow-hidden"><FileType className="text-indigo-500 shrink-0" size={18}/><span className="text-sm font-bold text-indigo-900 truncate">{d.name}</span></div>
                    {onRm ? <button onClick={()=>onRm(i)} className="text-red-500 hover:bg-red-50 p-1.5 rounded-lg shrink-0 transition-colors"><X size={16}/></button> : <a href={d.data} download={d.name} className="text-blue-700 bg-blue-100 hover:bg-blue-600 hover:text-white transition-colors px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm">Tải Về</a>}
                </div>
            ))}</div>;
        };

        // MAIN APP
        function CaseManagementDemo() {
          const [activeTab, setActiveTab] = useState('dashboard');
          const [clients, setClients] = useState(() => { const s = localStorage.getItem('ussh_hcm_clients_data'); return s ? JSON.parse(s) : []; });
          useEffect(() => { localStorage.setItem('ussh_hcm_clients_data', JSON.stringify(clients)); }, [clients]);

          const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'info', onConfirm: null, onCancel: null });
          const [clientFilter, setClientFilter] = useState('active'); 
          const [searchQuery, setSearchQuery] = useState('');

          const [selectedClient, setSelectedClient] = useState(null);
          const [detailSubTab, setDetailSubTab] = useState('info'); 
          
          const [isEditInfo, setIsEditInfo] = useState(false);
          const [editInfo, setEditInfo] = useState({});
          const [isEditAssess, setIsEditAssess] = useState(false);
          const [editAssess, setEditAssess] = useState({ S:'', W:'', O:'', T:'', problems:[] });
          const [newProbTxt, setNewProbTxt] = useState('');

          const [showAddGoal, setShowAddGoal] = useState(false);
          const [newGoal, setNewGoal] = useState({ text:'', activity:'', linkedReferral:'', deadline:'', baseline:0, target:10, unit:'Điểm' });
          const [updatingGoalId, setUpdatingGoalId] = useState(null); 
          const [editingGoalId, setEditingGoalId] = useState(null); 
          const [editGoal, setEditGoal] = useState({});
          const [kpiVal, setKpiVal] = useState(0);
          const [kpiDate, setKpiDate] = useState(''); 

          const [showAddRef, setShowAddRef] = useState(false);
          const [newRef, setNewRef] = useState({ org:'', service:'', condition:'', status:'Đã kết nối' });
          const [editingRefIndex, setEditingRefIndex] = useState(null);
          const [editRefData, setEditRefData] = useState({});

          const [isEditEval, setIsEditEval] = useState(false);
          const [evalNote, setEvalNote] = useState('');

          const initClient = { fullName:'', studentId:'', recordDate:getTodayYMD(), disabilityType:'', disabilityOther:'', disabilitySeverity:'Chưa xác định', age:'', ethnicity:'', religion:'', category:'', phone:'', address:'', interventionLevel:'Phòng ngừa/Theo dõi', family:'', needs:'', notes:'', problems:[], swot_S:'', swot_W:'', swot_O:'', swot_T:'', avatar:'', documents:[] };
          const [newClient, setNewClient] = useState(initClient);
          const [rawNotes, setRawNotes] = useState('');
          const [isExtracting, setIsExtracting] = useState(false);
          const [exError, setExError] = useState('');

          const alert = (title, msg, type='info') => setModal({ isOpen:true, title, message:msg, type, onConfirm:()=>setModal(p=>({...p,isOpen:false})) });
          const confirm = (title, msg, onConfirm) => setModal({ isOpen:true, title, message:msg, type:'confirm', onConfirm:()=>{onConfirm();setModal(p=>({...p,isOpen:false}));}, onCancel:()=>setModal(p=>({...p,isOpen:false})) });

          // Handlers
          const handleAvatar = (e, setter, st) => { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>setter({...st, avatar:ev.target.result}); r.readAsDataURL(f); };
          const handleDocs = (e, setter) => {
              const files = Array.from(e.target.files); if(!files.length) return;
              files.forEach(f => { const r=new FileReader(); r.onload=ev=>setter(p=>({...p, documents:[...(p.documents||[]), {name:f.name, data:ev.target.result, id:Date.now()+Math.random()}]})); r.readAsDataURL(f); });
              e.target.value = null;
          };
          const handleRemoveDoc = (idx, stateSetter) => stateSetter(p=>({...p, documents: p.documents.filter((_,i)=>i!==idx)}));

          const moveArr = (arr, i, dir) => { const r=[...arr]; if(dir==='up'&&i>0)[r[i-1],r[i]]=[r[i],r[i-1]]; if(dir==='down'&&i<r.length-1)[r[i+1],r[i]]=[r[i],r[i+1]]; return r; };
          const getWarn = (dl, st) => {
            if(st==='Hoàn thành'||!dl) return null;
            const d = Math.ceil((parseDateStr(dl)-new Date())/86400000);
            if(d<0) return { t:`Quá hạn ${Math.abs(d)} ngày`, c:'text-red-700 bg-red-100 border-red-300' };
            if(d<=7) return { t:d===0?'Hết hạn hôm nay':`Còn ${d} ngày`, c:'text-amber-800 bg-amber-100 border-amber-300' }; return null;
          };
          const warnings = clients.flatMap(c => c.status!=='Đã đóng ca' ? (c.details?.goals||[]).map(g=>({client:c, goal:g, warn:getWarn(g.deadline, g.status)})).filter(w=>w.warn) : []);
          
          const Badge = ({level}) => {
            const m = {'Can thiệp Khẩn cấp':['🔴 Khẩn cấp','bg-red-50 text-red-700 border-red-300'],'Can thiệp Chuyên sâu':['🟣 Chuyên sâu','bg-purple-50 text-purple-700 border-purple-300'],'Hỗ trợ Cơ bản':['🔵 Cơ bản','bg-blue-50 text-blue-700 border-blue-300'],'Phòng ngừa/Theo dõi':['🟢 Phòng ngừa','bg-emerald-50 text-emerald-700 border-emerald-300']};
            const [t,c] = m[level] || [level||'Chưa rõ', 'bg-gray-50 text-gray-700 border-gray-300'];
            return <span className={`px-2 py-1 rounded-md text-xs font-bold border-2 w-max whitespace-nowrap shadow-sm ${c}`}>{t}</span>;
          };

          const updateClient = (upd) => { setClients(clients.map(c=>c.id===upd.id?upd:c)); setSelectedClient(upd); };
          const navDetail = (c, tab='info') => { setSelectedClient(c); setActiveTab('clientDetail'); setDetailSubTab(tab); setIsEditInfo(false); setIsEditAssess(false); setShowAddGoal(false); setEditingGoalId(null); setIsEditEval(false); setEditingRefIndex(null); setShowAddRef(false); };
          
          const startEditingInfo = () => {
              let fDate = getTodayYMD(); if(selectedClient.recordDate) { const p = selectedClient.recordDate.split('/'); if(p.length===3) fDate=`${p[2]}-${p[1]}-${p[0]}`; }
              setEditInfo({ ...selectedClient, recordDate: fDate, family: selectedClient.details.family, needs: selectedClient.details.needs, notes: selectedClient.details.notes }); setIsEditInfo(true); 
          };
          const saveEditingInfo = () => {
            if (editInfo.disabilityType && editInfo.disabilityType !== '' && editInfo.disabilitySeverity === 'Chưa xác định') {
                alert('Lỗi Dữ Liệu', 'Vì thân chủ có loại khuyết tật, vui lòng chọn "Mức độ khuyết tật" tương ứng!', 'error');
                return;
            }
            updateClient({ ...selectedClient, ...editInfo, alias: getAliasFromName(editInfo.fullName), recordDate: formatDateToVN(editInfo.recordDate), details: { ...selectedClient.details, family: editInfo.family, needs: editInfo.needs, notes: editInfo.notes } });
            setIsEditInfo(false); alert('Thành công', 'Đã cập nhật thông tin!', 'success');
          };

          const startEditingAssessment = () => {
              setEditAssess({ S: selectedClient.details.swot.S.join('\n'), W: selectedClient.details.swot.W.join('\n'), O: selectedClient.details.swot.O.join('\n'), T: selectedClient.details.swot.T.join('\n'), problems: [...(selectedClient.details.problems||[])] });
              setNewProbTxt(''); setIsEditAssess(true);
          };
          const saveEditingAssessment = () => {
              updateClient({ ...selectedClient, details: { ...selectedClient.details, problems: editAssess.problems, swot: { S: editAssess.S.split('\n').filter(i=>i.trim()), W: editAssess.W.split('\n').filter(i=>i.trim()), O: editAssess.O.split('\n').filter(i=>i.trim()), T: editAssess.T.split('\n').filter(i=>i.trim()) } } });
              setIsEditAssess(false); alert('Thành công', 'Đã cập nhật Đánh giá và Vấn đề!', 'success');
          };

          const handleSaveNewClient = () => {
            if(!newClient.fullName) { alert('Lỗi Dữ Liệu', 'Cần nhập Họ và tên đầy đủ.', 'error'); return; }
            if(newClient.disabilityType && newClient.disabilityType !== '' && newClient.disabilitySeverity === 'Chưa xác định') {
                alert('Lỗi Dữ Liệu', 'Vì thân chủ có loại khuyết tật, vui lòng chọn "Mức độ khuyết tật" tương ứng!', 'error'); return;
            }
            
            const rDate = formatDateToVN(newClient.recordDate);
            const pArr = (v) => Array.isArray(v)?v:(v?v.split('\n').filter(i=>i.trim()):[]);
            setClients([{ id: `KH-${Math.floor(Math.random()*1000).toString().padStart(3,'0')}`, ...newClient, alias: getAliasFromName(newClient.fullName), recordDate: rDate, status: 'Tiếp nhận mới', details: { family: newClient.family, needs: newClient.needs, history: newClient.history, problems: newClient.problems, swot: { S: pArr(newClient.swot_S), W: pArr(newClient.swot_W), O: pArr(newClient.swot_O), T: pArr(newClient.swot_T) }, notes: newClient.notes, evaluationNotes: '', goals: [], referrals: [], timeline: [{ date: rDate, event: `Khởi tạo hồ sơ.` }] } }, ...clients]);
            setNewClient(initClient); setRawNotes(''); alert('Thành công', 'Đã lưu Hồ sơ mới.', 'success'); setActiveTab('clients');
          };

          // AI EXTRACTION
          const runGeminiExtraction = async (text) => {
            setIsExtracting(true); setExError('');
            const prompt = `NVCTXH. Xuất JSON: { "recordDate":"YYYY-MM-DD", "fullName":"", "studentId":"", "age":"", "disabilityType":"Vận động/Nghe, nói/Nhìn/Thần kinh, tâm thần/Trí tuệ/Khác", "disabilitySeverity":"Đặc biệt nặng/Nặng/Nhẹ/Chưa xác định", "ethnicity":"", "religion":"", "category":"", "interventionLevel":"Can thiệp Khẩn cấp/Can thiệp Chuyên sâu/Hỗ trợ Cơ bản/Phòng ngừa/Theo dõi", "phone":"", "address":"", "family":"", "needs":"", "problems":[""], "swot_S":"", "swot_W":"", "swot_O":"", "swot_T":"", "notes":""}. Text: "${text}"`;
            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } }) });
              if (!res.ok) throw new Error();
              const data = await res.json();
              const pData = JSON.parse(data.candidates[0].content.parts[0].text || "{}");
              if(pData.disabilityType && !["Vận động", "Nghe, nói", "Nhìn", "Thần kinh, tâm thần", "Trí tuệ", "Khác", ""].includes(pData.disabilityType)) { pData.disabilityOther = pData.disabilityType; pData.disabilityType = "Khác"; }
              setNewClient(p => ({ ...p, ...pData }));
            } catch (e) { setExError('AI lỗi định dạng/kết nối. Hãy nhập tay.'); } finally { setIsExtracting(false); }
          };
          const handleAutoFillNotes = () => { if (!rawNotes.trim()) { setExError('Vui lòng nhập nội dung báo cáo.'); return; } runGeminiExtraction(rawNotes); };
          const handleFile = (e) => { const f = e.target.files[0]; if(!f) return; setIsExtracting(true); if (f.name.endsWith('.docx') && window.mammoth) { const r = new FileReader(); r.onload = ev => window.mammoth.extractRawText({arrayBuffer: ev.target.result}).then(r=>{setRawNotes(r.value); runGeminiExtraction(r.value);}); r.readAsArrayBuffer(f); } else { const r = new FileReader(); r.onload = ev => {setRawNotes(ev.target.result); runGeminiExtraction(ev.target.result);}; r.readAsText(f); } };

          const filteredClients = clients.filter(c => {
              const sm = clientFilter === 'active' ? c.status !== 'Đã đóng ca' : c.status === 'Đã đóng ca';
              const q = searchQuery.toLowerCase();
              return sm && (!q || (c.fullName||'').toLowerCase().includes(q) || (c.alias||'').toLowerCase().includes(q) || (c.id||'').toLowerCase().includes(q) || (c.studentId||'').toLowerCase().includes(q) || String(c.age||'').includes(q) || (c.category||'').toLowerCase().includes(q) || (c.disabilityType||'').toLowerCase().includes(q) || (c.disabilityOther||'').toLowerCase().includes(q) || (c.details?.problems||[]).some(p=>p.toLowerCase().includes(q)));
          });

          // GOALS & KPI Logic
          const handleToggleGoalStatus = (goalId, currentStatus) => {
            const newStatus = currentStatus === 'Hoàn thành' ? 'Đang tiến hành' : 'Hoàn thành';
            const updatedGoals = selectedClient.details.goals.map(g => {
              if (g.id !== goalId) return g;
              let kpi = { ...g.kpi };
              if (newStatus === 'Hoàn thành' && g.kpi) { kpi.current = g.kpi.target; kpi.history = [...(kpi.history||[]), { date: new Date().toLocaleDateString('vi-VN'), value: g.kpi.target }]; kpi.history.sort((a, b) => parseDateStr(a.date) - parseDateStr(b.date)); }
              return { ...g, status: newStatus, kpi };
            });
            updateClient({ ...selectedClient, details: { ...selectedClient.details, goals: updatedGoals } });
          };

          const handleSaveNewGoal = () => {
            if(!newGoal.text||!newGoal.deadline) { alert('Lỗi', 'Thiếu Tên hoặc Hạn chót.', 'error'); return; }
            const g = { id:Date.now(), text:newGoal.text, activity:newGoal.activity, linkedReferral:newGoal.linkedReferral, status:'Chưa bắt đầu', deadline:formatDateToVN(newGoal.deadline), kpi:{baseline:Number(newGoal.baseline), current:Number(newGoal.baseline), target:Number(newGoal.target), unit:newGoal.unit, history:[{date:new Date().toLocaleDateString('vi-VN'), value:Number(newGoal.baseline)}]} };
            updateClient({...selectedClient, details: {...selectedClient.details, goals:[...selectedClient.details.goals, g]}});
            setNewGoal({text:'', activity:'', linkedReferral:'', deadline:'', baseline:0, target:10, unit:'Điểm'}); setShowAddGoal(false);
          };

          const saveEditingGoal = () => {
            const updatedGoals = selectedClient.details.goals.map(g => {
                if(g.id===editingGoalId){ const b=Number(editGoal.baseline); const t=Number(editGoal.target); const d=(b<t&&g.kpi.current>=t)||(b>t&&g.kpi.current<=t); return {...g, text:editGoal.text, activity:editGoal.activity, linkedReferral:editGoal.linkedReferral, deadline:formatDateToVN(editGoal.deadline), status: d?'Hoàn thành':(g.kpi.current!==b?'Đang tiến hành':'Chưa bắt đầu'), kpi:{...g.kpi, baseline:b, target:t, unit:editGoal.unit}}; } return g;
            });
            updateClient({...selectedClient, details:{...selectedClient.details, goals:updatedGoals}}); setEditingGoalId(null);
          };

          const saveKpiUpdate = (id) => {
            const fmtDate = formatDateToVN(kpiDate); const v = Number(kpiVal);
            const upG = selectedClient.details.goals.map(g => {
                if(g.id!==id) return g; const h=[...(g.kpi.history||[])]; const x=h.findIndex(i=>i.date===fmtDate); if(x>=0) h[x].value=v; else h.push({date:fmtDate,value:v}); h.sort((a,b)=>parseDateStr(a.date)-parseDateStr(b.date));
                const d = (g.kpi.baseline<g.kpi.target&&v>=g.kpi.target)||(g.kpi.baseline>g.kpi.target&&v<=g.kpi.target);
                return {...g, status:d?'Hoàn thành':(v!==g.kpi.baseline?'Đang tiến hành':'Chưa bắt đầu'), kpi:{...g.kpi, current:v, history:h}};
            });
            updateClient({...selectedClient, details:{...selectedClient.details, goals:upG, timeline:[{date:fmtDate, event:`Cập nhật KPI: ${upG.find(i=>i.id===id).text} -> ${v}`}, ...(selectedClient.details.timeline||[])]}}); setUpdatingGoalId(null);
          };

          // REFERRALS LOGIC
          const handleSaveNewReferral = () => {
            if(!newRef.org||!newRef.service) return;
            updateClient({...selectedClient, details:{...selectedClient.details, referrals:[...(selectedClient.details.referrals||[]), {...newRef, date:new Date().toLocaleDateString('vi-VN')}]}});
            setNewRef({org:'',service:'',condition:'',status:'Đã kết nối'}); setShowAddRef(false);
          };

          const saveEditingReferral = () => {
             if(!editRefData.org || !editRefData.service) { alert('Lỗi','Tên tổ chức và dịch vụ không được trống','error'); return; }
             const upRefs = [...selectedClient.details.referrals];
             upRefs[editingRefIndex] = { ...editRefData };
             updateClient({...selectedClient, details:{...selectedClient.details, referrals:upRefs}});
             setEditingRefIndex(null);
          };

          // CLOSE / REOPEN CASE
          const handleCloseCase = () => confirm('Đóng ca', 'Hành động này sẽ lưu trữ hồ sơ.', () => { 
              updateClient({ ...selectedClient, status: 'Đã đóng ca', details: { ...selectedClient.details, timeline: [{ date: new Date().toLocaleDateString('vi-VN'), event: 'Tiến hành lượng giá cuối kỳ. Đóng ca.' }, ...(selectedClient.details.timeline||[])] } }); 
              alert('Thành công', 'Đã đóng ca!', 'success'); 
              setActiveTab('clients'); 
          });
          
          const handleReopenCase = () => confirm('Mở lại hồ sơ', 'Bạn muốn mở lại hồ sơ này?', () => { 
              updateClient({ ...selectedClient, status: 'Đang can thiệp', details: { ...selectedClient.details, timeline: [{ date: new Date().toLocaleDateString('vi-VN'), event: 'Hồ sơ được mở lại.' }, ...(selectedClient.details.timeline||[])] } }); 
              alert('Thành công', 'Đã mở lại hồ sơ!', 'success'); 
          });

          // Render Helpers
          const renderInfoForm = (d, setD) => (
            <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-white p-5 border-2 border-slate-300 rounded-xl shadow-sm">
                    <h4 className="col-span-full font-bold text-slate-800 border-b-2 border-slate-200 pb-2 mb-2 flex items-center gap-2">👤 Định danh & Liên hệ</h4>
                    <Field cls="md:col-span-2" lCls="text-blue-700" label="Họ và tên đầy đủ *" val={d.fullName} setVal={v=>setD({...d,fullName:v})}/>
                    <Field label="Mã số sinh viên" val={d.studentId} setVal={v=>setD({...d,studentId:v})}/>
                    <Field label="Ngày ghi nhận" type="date" val={d.recordDate} setVal={v=>setD({...d,recordDate:v})}/>
                    <Field label="Độ tuổi" type="number" val={d.age} setVal={v=>setD({...d,age:v})}/>
                    <Field label="Số điện thoại" val={d.phone} setVal={v=>setD({...d,phone:v})}/>
                    <Field label="Dân tộc" val={d.ethnicity} setVal={v=>setD({...d,ethnicity:v})}/>
                    <Field label="Tôn giáo" val={d.religion} setVal={v=>setD({...d,religion:v})}/>
                    <Field cls="md:col-span-3" label="Khu vực/Địa chỉ hiện tại" val={d.address} setVal={v=>setD({...d,address:v})}/>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-red-50/50 p-5 border-2 border-red-300 rounded-xl shadow-sm">
                    <h4 className="col-span-full font-bold text-red-800 border-b-2 border-red-200 pb-2 mb-2 flex items-center gap-2">🏥 Khuyết tật & Can thiệp</h4>
                    <Field lCls="text-red-800" iCls="bg-white border-red-300 focus:border-red-500 text-red-900" type="select" opts={["","Vận động","Nghe, nói","Nhìn","Thần kinh, tâm thần","Trí tuệ","Khác"]} label="Loại khuyết tật" val={d.disabilityType} setVal={v=>setD({...d,disabilityType:v})}/>
                    {d.disabilityType==='Khác' ? (
                        <><Field lCls="text-red-800" iCls="bg-white border-red-300 focus:border-red-500 text-red-900" label="Mô tả khuyết tật khác" val={d.disabilityOther} setVal={v=>setD({...d,disabilityOther:v})}/>
                        <Field lCls="text-red-800" iCls="bg-white border-red-300 focus:border-red-500 text-red-900" type="select" opts={["Chưa xác định","Nhẹ","Nặng","Đặc biệt nặng"]} label="Mức độ khuyết tật *" val={d.disabilitySeverity} setVal={v=>setD({...d,disabilitySeverity:v})}/></>
                    ) : (
                        <Field lCls="text-red-800" iCls="bg-white border-red-300 focus:border-red-500 text-red-900" type="select" opts={["Chưa xác định","Nhẹ","Nặng","Đặc biệt nặng"]} label="Mức độ khuyết tật *" val={d.disabilitySeverity} setVal={v=>setD({...d,disabilitySeverity:v})}/>
                    )}
                    <Field lCls="text-purple-800" iCls="bg-white border-purple-300 focus:border-purple-500 text-purple-900" type="select" opts={["Can thiệp Khẩn cấp","Can thiệp Chuyên sâu","Hỗ trợ Cơ bản","Phòng ngừa/Theo dõi"]} label="Mức can thiệp" val={d.interventionLevel} setVal={v=>setD({...d,interventionLevel:v})}/>
                    <Field cls="md:col-span-3" lCls="text-slate-800" iCls="bg-white border-slate-300 focus:border-slate-500" label="Nhóm vấn đề (Phân loại khác nếu có)" val={d.category} setVal={v=>setD({...d,category:v})}/>
                </div>
                <div className="grid grid-cols-1 gap-4 bg-blue-50/30 p-5 border-2 border-blue-300 rounded-xl shadow-sm">
                    <h4 className="font-bold text-blue-900 border-b-2 border-blue-200 pb-2 flex items-center gap-2">📖 Hoàn cảnh & Nhu cầu</h4>
                    <Field type="textarea" lCls="text-blue-900" iCls="bg-white border-blue-200 focus:border-blue-500" label="Hoàn cảnh gia đình" val={d.family} setVal={v=>setD({...d,family:v})}/>
                    <Field type="textarea" lCls="text-blue-900" iCls="bg-white border-blue-200 focus:border-blue-500" label="Nhu cầu, mong muốn của thân chủ" val={d.needs} setVal={v=>setD({...d,needs:v})}/>
                    <Field type="textarea" lCls="text-blue-900" iCls="bg-white border-blue-200 focus:border-blue-500" label="Ghi chú chuyên môn (Nếu có)" val={d.notes} setVal={v=>setD({...d,notes:v})}/>
                </div>
            </div>
          );

          const renderSwotForm = (d, setD) => (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <SwotField c1="text-emerald-800" c2="border-emerald-400 bg-emerald-50/30 focus:bg-white focus:border-emerald-600" l="S - Điểm mạnh" v={d.swot_S||d.S} setV={v=>setD(d.swot_S!==undefined?{...d,swot_S:v}:{...d,S:v})}/>
                <SwotField c1="text-orange-800" c2="border-orange-400 bg-orange-50/30 focus:bg-white focus:border-orange-600" l="W - Điểm yếu" v={d.swot_W||d.W} setV={v=>setD(d.swot_W!==undefined?{...d,swot_W:v}:{...d,W:v})}/>
                <SwotField c1="text-blue-800" c2="border-blue-400 bg-blue-50/30 focus:bg-white focus:border-blue-600" l="O - Cơ hội" v={d.swot_O||d.O} setV={v=>setD(d.swot_O!==undefined?{...d,swot_O:v}:{...d,O:v})}/>
                <SwotField c1="text-purple-800" c2="border-purple-400 bg-purple-50/30 focus:bg-white focus:border-purple-600" l="T - Thách thức" v={d.swot_T||d.T} setV={v=>setD(d.swot_T!==undefined?{...d,swot_T:v}:{...d,T:v})}/>
            </div>
          );

          return (
            <div className="flex h-screen bg-slate-50 font-sans text-slate-800">
              {modal.isOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40">
                  <div className="bg-white border-2 border-slate-300 rounded-xl p-6 max-w-md w-full animate-in shadow-2xl">
                    <h3 className="text-lg font-bold mb-3 text-slate-800">{modal.title}</h3>
                    <p className="mb-5 whitespace-pre-wrap text-sm text-slate-600">{modal.message}</p>
                    <div className="flex justify-end gap-2">{modal.type==='confirm'&&<button onClick={modal.onCancel} className="px-4 py-2 bg-slate-100 font-bold text-slate-700 text-sm rounded-lg hover:bg-slate-200 border-2 border-slate-200 transition-colors">Hủy</button>}<button onClick={modal.onConfirm} className={`px-4 py-2 font-bold text-sm rounded-lg text-white border-2 transition-colors ${modal.type==='error'?'bg-red-600 border-red-700 hover:bg-red-700':'bg-blue-600 border-blue-700 hover:bg-blue-700'}`}>{modal.type==='confirm'?'Đồng ý':'Đóng'}</button></div>
                  </div>
                </div>
              )}

              {/* SIDEBAR */}
              <div className="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-xl z-10 border-r-2 border-slate-800">
                <div className="p-6 border-b-2 border-slate-800"><h1 className="text-xl font-black text-blue-400 tracking-tight">USSH <span className="text-white">HCM</span></h1><p className="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wider">Quản lý Trường hợp</p></div>
                <nav className="flex-1 px-4 space-y-2 mt-4">
                  <button onClick={()=>{setActiveTab('dashboard');setSelectedClient(null);}} className={`w-full flex items-center gap-3 px-4 py-3 text-sm rounded-xl font-bold transition-all border-2 ${activeTab==='dashboard'?'bg-blue-600 border-blue-500 shadow-md text-white':'border-transparent hover:bg-slate-800 text-slate-300 hover:border-slate-700'}`}><LayoutDashboard size={18}/> Tổng quan</button>
                  <button onClick={()=>{setActiveTab('clients');setSelectedClient(null);}} className={`w-full flex items-center gap-3 px-4 py-3 text-sm rounded-xl font-bold transition-all border-2 ${['clients','clientDetail'].includes(activeTab)?'bg-blue-600 border-blue-500 shadow-md text-white':'border-transparent hover:bg-slate-800 text-slate-300 hover:border-slate-700'}`}><Users size={18}/> Danh sách Hồ sơ</button>
                  <button onClick={()=>{setActiveTab('addClient');setSelectedClient(null);}} className={`w-full flex items-center gap-3 px-4 py-3 text-sm rounded-xl font-bold transition-all border-2 ${activeTab==='addClient'?'bg-blue-600 border-blue-500 shadow-md text-white':'border-transparent hover:bg-slate-800 text-slate-300 hover:border-slate-700'}`}><FileSignature size={18}/> Tiếp nhận Mới</button>
                </nav>
                <div className="p-4 border-t-2 border-slate-800"><button onClick={()=>confirm('CẢNH BÁO', 'Xóa toàn bộ dữ liệu demo?', ()=> {localStorage.removeItem('ussh_hcm_clients_data'); window.location.reload();})} className="w-full flex justify-center items-center gap-2 py-2.5 bg-slate-800 hover:bg-red-900 border-2 border-slate-700 hover:border-red-800 text-slate-300 hover:text-red-300 rounded-lg text-xs font-bold transition-all shadow-sm"><Trash2 size={14}/> Reset Dữ Liệu</button></div>
              </div>

              {/* MAIN CONTENT */}
              <div className="flex-1 flex flex-col overflow-hidden relative">
                <header className="h-16 bg-white border-b-2 border-slate-200 flex items-center justify-between px-6 shrink-0 shadow-sm z-10">
                  <h2 className="text-lg font-bold text-slate-800">{activeTab==='dashboard'?'Bảng Điều Khiển Hệ Thống':activeTab==='clients'?'Quản lý Danh sách Hồ sơ':activeTab==='addClient'?'Tạo Hồ Sơ Mới':'Chi tiết Hồ sơ Quản lý'}</h2>
                  <div className="flex items-center gap-2 bg-emerald-50 border-2 border-emerald-200 text-emerald-800 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm"><div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> Mạng Nội Bộ</div>
                </header>
                
                <main className="flex-1 overflow-y-auto p-6 hide-scrollbar bg-slate-50/50">
                  
                  {activeTab === 'dashboard' && (
                     <div className="animate-in space-y-6">
                        <div className="grid grid-cols-3 gap-5">
                            <div className="bg-white p-5 border-2 border-slate-300 border-l-8 border-l-blue-500 rounded-xl shadow-sm"><p className="text-xs font-bold text-slate-500 uppercase tracking-wide">Đang quản lý</p><p className="text-3xl font-black mt-2 text-slate-800">{clients.filter(c=>c.status!=='Đã đóng ca').length}</p></div>
                            <div className="bg-white p-5 border-2 border-slate-300 border-l-8 border-l-red-500 rounded-xl shadow-sm"><p className="text-xs font-bold text-slate-500 uppercase tracking-wide">Báo động Khẩn cấp</p><p className="text-3xl font-black text-red-600 mt-2">{clients.filter(c=>c.interventionLevel==='Can thiệp Khẩn cấp'&&c.status!=='Đã đóng ca').length}</p></div>
                            <button onClick={()=>setActiveTab('addClient')} className="bg-blue-600 hover:bg-blue-700 transition-colors border-2 border-blue-700 text-white font-bold p-5 rounded-xl shadow-sm flex items-center justify-center gap-2 text-base"><PlusCircle size={24}/> TẠO HỒ SƠ MỚI</button>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border-2 border-slate-300">
                            <h3 className="font-bold text-lg mb-5 text-amber-900 flex items-center gap-2 border-b-2 border-slate-100 pb-3"><BellRing className="text-amber-600" size={20}/> Chuông báo Cảnh báo Hạn KPI</h3>
                            {warnings.length>0 ? warnings.map((w,i)=><div key={i} className={`p-4 border-2 rounded-lg flex justify-between items-center mb-3 shadow-sm ${w.warn.c}`}><div><b className="text-base">[{w.client.id}] {w.client.alias}</b><br/><span className="text-sm font-medium opacity-90">{w.goal.text}</span></div><button onClick={()=>navDetail(w.client,'plan')} className="px-4 py-2 bg-white font-bold text-xs rounded-md border-2 shadow-sm hover:scale-105 transition-transform">{w.warn.t}</button></div>) : <div className="text-center py-8 bg-slate-50 rounded-lg border-2 border-dashed border-slate-300"><CheckCircle size={40} className="mx-auto text-green-300 mb-3"/><p className="text-slate-600 font-bold text-sm">Tuyệt vời! Mọi mục tiêu đều đi đúng tiến độ.</p></div>}
                        </div>
                     </div>
                  )}

                  {activeTab === 'clients' && (
                     <div className="animate-in bg-white rounded-xl shadow-sm border-2 border-slate-300 overflow-hidden">
                        <div className="p-5 border-b-2 border-slate-200 flex flex-wrap justify-between items-center gap-4 bg-slate-50">
                            <div className="relative"><Search className="absolute left-3 top-2.5 text-slate-400" size={16}/><input type="text" value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Tìm kiếm tên, MSSV, Vấn đề..." className="pl-9 pr-4 py-2 text-sm border-2 border-slate-300 rounded-lg w-72 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 transition-all bg-white font-medium shadow-sm"/></div>
                            <div className="flex items-center gap-2"><div className="flex bg-slate-200 p-1 rounded-lg border-2 border-slate-300"><button onClick={()=>setClientFilter('active')} className={`px-4 py-1.5 font-bold text-xs rounded-md transition-all ${clientFilter==='active'?'bg-white shadow-sm text-blue-700 border border-slate-200':'text-slate-600 hover:text-slate-900'}`}>Đang mở</button><button onClick={()=>setClientFilter('closed')} className={`px-4 py-1.5 font-bold text-xs rounded-md transition-all ${clientFilter==='closed'?'bg-white shadow-sm text-slate-800 border border-slate-200':'text-slate-600 hover:text-slate-900'}`}>Đã đóng</button></div></div>
                        </div>
                        <div className="overflow-x-auto">
                        <table className="w-full text-left">
                            <thead className="bg-slate-100 text-xs uppercase tracking-wider text-slate-600 border-b-2 border-slate-200"><tr><th className="px-4 py-3 font-bold">Mã ID</th><th className="px-4 py-3 font-bold">Bí danh</th><th className="px-4 py-3 font-bold">MSSV</th><th className="px-4 py-3 font-bold">Khuyết tật</th><th className="px-4 py-3 font-bold">Nhóm</th><th className="px-4 py-3 font-bold">Mức can thiệp</th><th className="px-4 py-3 font-bold text-center">Thao tác</th></tr></thead>
                            <tbody className="divide-y-2 divide-slate-100">
                                {filteredClients.length > 0 ? filteredClients.map(c=>(
                                    <tr key={c.id} className="hover:bg-blue-50/50 transition-colors">
                                        <td className="px-4 py-3"><span className="bg-blue-100 border-2 border-blue-200 text-blue-800 font-bold px-2.5 py-1 rounded-md text-xs shadow-sm">{c.id}</span></td>
                                        <td className="px-4 py-3 font-bold text-slate-800 flex items-center gap-2 text-sm">{c.avatar?<img src={c.avatar} className="w-8 h-8 rounded-full object-cover border-2 border-slate-300 shadow-sm"/>:<div className="w-8 h-8 rounded-full bg-slate-200 border-2 border-slate-300 text-slate-600 flex items-center justify-center font-bold text-xs shadow-sm">{c.alias[0]||'U'}</div>}{c.alias}</td>
                                        <td className="px-4 py-3"><span className="font-mono font-medium text-slate-700 text-xs bg-slate-100 border-2 border-slate-200 px-2.5 py-1 rounded-md shadow-sm">{c.studentId||'N/A'}</span></td>
                                        <td className="px-4 py-3">{(c.disabilityType && c.disabilityType !== 'Không' && c.disabilityType !== 'Không rõ') ? <span className="bg-red-50 text-red-700 border-2 border-red-200 px-2.5 py-1 rounded-full text-xs font-bold shadow-sm">{c.disabilityType==='Khác'?c.disabilityOther:c.disabilityType}</span> : <span className="text-slate-400 font-medium text-xs">Không</span>}</td>
                                        <td className="px-4 py-3"><span className="bg-purple-50 text-purple-800 border-2 border-purple-200 px-2.5 py-1 rounded-full text-xs font-bold shadow-sm">{c.category || 'Chưa phân loại'}</span></td>
                                        <td className="px-4 py-3"><Badge level={c.interventionLevel}/></td>

                                                    </div>
                                                </div>
                                                <div className="flex flex-col justify-between items-end sm:items-end items-start border-t-2 sm:border-t-0 sm:border-l-2 border-slate-100 sm:pl-6 pt-4 sm:pt-0 shrink-0">
                                                    <div className="text-right w-full sm:w-auto">
                                                        <span className={`px-4 py-1.5 rounded-xl text-xs font-bold border-2 inline-block mb-2 shadow-sm ${['Chưa phản hồi','Từ chối'].includes(r.status)?'bg-red-50 text-red-800 border-red-300':r.status==='Đã kết nối'?'bg-emerald-50 text-emerald-800 border-emerald-300':'bg-blue-50 text-blue-800 border-blue-300'}`}>{r.status}</span>
                                                        <p className="text-xs text-slate-500 font-bold">Cập nhật: {r.date}</p>
                                                    </div>
                                                    <div className="flex gap-2 mt-3">
                                                        <button onClick={()=>{setEditingRefIndex(i);setEditRefData({...r})}} className="bg-white border-2 border-slate-300 text-slate-700 hover:text-blue-700 hover:border-blue-300 hover:bg-blue-50 px-3 py-1.5 rounded-lg font-bold text-xs transition-colors flex items-center gap-1 shadow-sm"><Edit3 size={14}/> Sửa</button>
                                                        <button onClick={()=>confirm('CẢNH BÁO','Bạn có chắc chắn muốn gỡ bỏ liên kết nguồn lực này?',()=>{updateClient({...selectedClient, details:{...selectedClient.details, referrals:selectedClient.details.referrals.filter((_,x)=>x!==i)}})})} className="bg-white border-2 border-slate-300 text-slate-700 hover:text-red-700 hover:border-red-300 hover:bg-red-50 px-3 py-1.5 rounded-lg font-bold text-xs transition-colors flex items-center gap-1 shadow-sm"><Trash2 size={14}/> Xóa</button>
                                                    </div>
                                                </div>
                                            </div>
                                            );
                                        })}
                                        </div>
                                        {selectedClient.details.referrals.length===0 && !showAddRef && <div className="text-center py-12 border-2 border-dashed border-slate-300 rounded-2xl bg-slate-50"><Network size={48} className="mx-auto text-slate-300 mb-4"/><p className="text-lg font-bold text-slate-600 mb-1">Chưa có kết nối nào</p><p className="text-sm font-medium text-slate-500">Hãy thêm liên kết để quản lý mạng lưới hỗ trợ tốt hơn.</p></div>}
                                    </div>
                                )}
                                {/* TAB 5: EVALUATION */}
                                {detailSubTab==='evaluation' && (
                                    <div className="animate-in fade-in">
                                        <div className="flex justify-between items-center mb-8">
                                            <h3 className="font-bold text-lg text-slate-800 border-b-2 border-slate-200 pb-2">Lượng giá Tiến trình</h3>
                                            {selectedClient.status !== 'Đã đóng ca' ? (
                                                <button onClick={handleCloseCase} className="bg-slate-800 border-2 border-slate-900 hover:bg-slate-900 transition-colors text-white shadow-sm font-bold px-5 py-2.5 rounded-lg flex items-center gap-2 text-sm"><CheckCircle size={18}/> ĐÓNG CA</button>
                                            ) : (
                                                <div className="flex items-center gap-3">
                                                    <span className="bg-emerald-50 text-emerald-800 border-2 border-emerald-300 px-4 py-2 rounded-lg font-bold flex items-center gap-2 shadow-sm text-sm"><CheckCircle size={18}/> ĐÃ ĐÓNG CA</span>
                                                    <button onClick={handleReopenCase} className="bg-blue-600 border-2 border-blue-700 hover:bg-blue-700 text-white shadow-sm font-bold px-4 py-2 rounded-lg flex items-center gap-2 transition-colors text-sm"><RotateCcw size={18}/> Mở lại can thiệp</button>
                                                </div>
                                            )}
                                        </div>
                                        
                                        <div className="space-y-6">
                                            {selectedClient.details.goals.map(g => g.kpi.history.length>0 && (
                                                <div key={g.id} className="bg-white border-2 border-slate-300 p-6 rounded-2xl shadow-sm">
                                                    <div className="flex justify-between items-center mb-5 border-b-2 border-slate-200 pb-3">
                                                        <h4 className="font-bold text-base text-slate-800 flex items-center gap-2"><TrendingUp className="text-blue-600" size={20}/> Đo lường: <span className="text-blue-900">{g.text}</span></h4>
                                                        <div className="bg-blue-50 border-2 border-blue-200 px-4 py-1.5 rounded-lg shadow-sm"><span className="text-xs font-bold text-blue-800 uppercase tracking-wider">Tỷ lệ: {g.kpi.current} / {g.kpi.target} {g.kpi.unit}</span></div>
                                                    </div>
                                                    <MiniLineChart kpiData={g.kpi}/>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="bg-white border-2 border-slate-300 p-6 rounded-2xl shadow-sm mt-8">
                                            <div className="flex justify-between items-center mb-5 border-b-2 border-slate-200 pb-3">
                                                <h4 className="font-bold text-lg text-emerald-900 flex items-center gap-2"><FileSignature size={22} className="text-emerald-600"/> Báo cáo Lượng giá</h4>
                                                {!isEditEval ? (
                                                    <button onClick={()=>{setEvalNote(selectedClient.details.evaluationNotes);setIsEditEval(true);}} className="text-xs font-bold text-blue-800 bg-white border-2 border-blue-300 hover:bg-blue-600 hover:text-white transition-colors px-4 py-2 rounded-lg flex items-center gap-1.5 shadow-sm"><Edit3 size={14}/> Cập nhật báo cáo</button>
                                                ) : (
                                                    <div className="flex gap-2">
                                                        <button onClick={()=>setIsEditEval(false)} className="text-xs font-bold bg-white border-2 border-slate-300 text-slate-700 px-4 py-2 rounded-lg hover:bg-slate-100 shadow-sm transition-colors">Hủy</button>
                                                        <button onClick={()=>{updateClient({...selectedClient,details:{...selectedClient.details,evaluationNotes:evalNote}});setIsEditEval(false);}} className="text-xs font-bold bg-emerald-600 border-2 border-emerald-700 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition-colors"><Save size={14}/> Lưu Báo Cáo</button>
                                                    </div>
                                                )}
                                            </div>
                                            {!isEditEval ? (
                                                <div className="bg-slate-50 p-6 rounded-xl border-2 border-slate-200 min-h-[120px] shadow-inner">
                                                    {selectedClient.details.evaluationNotes ? (
                                                        <p className="text-slate-800 font-medium whitespace-pre-wrap leading-relaxed text-sm">{selectedClient.details.evaluationNotes}</p>
                                                    ) : (
                                                        <div className="flex flex-col items-center justify-center h-full text-slate-400 py-6"><FileText size={40} className="mb-3 opacity-50"/><p className="font-bold text-sm italic">Chưa ghi nhận báo cáo tổng quát nào cho ca này.</p></div>
                                                    )}
                                                </div>
                                            ) : (
                                                <textarea rows={8} className="w-full p-4 border-2 border-emerald-400 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/50 bg-emerald-50/50 text-slate-900 font-medium text-sm shadow-inner" value={evalNote} onChange={e=>setEvalNote(e.target.value)} placeholder="Nhập nhận xét về sự tiến bộ, điểm cần khắc phục của thân chủ sau quá trình hỗ trợ, cũng như các khuyến nghị tiếp theo..."></textarea>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                     </div>
                  )}
                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><CaseManagementDemo /></ErrorBoundary>);
    </script>
</body>
</html>
